<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6f8">
<title>澳門430法例選擇題</title>
<meta name="description" content="澳門 430 法例選擇題 · 604 題 · 練習模式與考試模式">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='32' y='44' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle' font-family='sans-serif'>430</text></svg>">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface2:#fafbfc;
  --text:#16181d; --muted:#6b7280; --border:#e6e8ec;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --ok:#15803d; --ok-bg:#f0fdf4; --ok-bd:#bbf7d0;
  --bad:#dc2626; --bad-bg:#fef2f2; --bad-bd:#fecaca;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom));}
.screen{display:none;}
.screen.on{display:block;}

/* ---------- home ---------- */
#scr-home{padding-top:14vh;}
.brand h1{font-size:27px;margin:0 0 6px;letter-spacing:.5px;font-weight:700;}
.brand p{margin:0 0 30px;color:var(--muted);font-size:14px;}
.cards{display:grid;gap:14px;}
.card{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
  transition:transform .12s,box-shadow .12s,border-color .12s;
  font-family:inherit;color:inherit;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:#d8dbe2;}
.card:active{transform:translateY(0);}
.card b{font-size:18px;font-weight:650;}
.card small{color:var(--muted);font-size:13px;}
.card .tp{font-size:13px;color:var(--accent);margin-top:6px;font-weight:500;}
.card .ico{font-size:22px;margin-bottom:6px;}
.stat{margin-top:22px;color:var(--muted);font-size:12.5px;text-align:center;}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(245,246,248,.92);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin:0 0 12px;border-bottom:1px solid var(--border);
}
.bar h2{font-size:16px;margin:0;font-weight:600;flex:1;text-align:center;}
.bar .prog{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;text-align:center;}
.btn{
  font-family:inherit;font-size:14px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:8px 14px;box-shadow:var(--shadow);
  transition:transform .1s,background .12s;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);padding:8px 6px;}
.btn[disabled]{opacity:.4;pointer-events:none;}

/* ---------- scope list ---------- */
.scope-group{margin-bottom:20px;}
.scope-group h3{font-size:12.5px;color:var(--muted);margin:0 0 8px;font-weight:600;letter-spacing:.4px;}
.scope-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 15px;margin-bottom:8px;font-family:inherit;font-size:15px;color:inherit;
  box-shadow:var(--shadow);transition:transform .1s,border-color .12s;
}
.scope-item:active{transform:scale(.99);}
.scope-item .nm{flex:1;font-weight:500;}
.scope-item .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.scope-item .bar-mini{width:52px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;flex:none;}
.scope-item .bar-mini i{display:block;height:100%;background:var(--accent);border-radius:3px;}

/* ---------- question ---------- */
.qwrap{position:relative;}
.qmeta{font-size:12.5px;color:var(--muted);margin-bottom:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.qmeta .chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 10px;}
.stem{font-size:17px;line-height:1.62;font-weight:500;margin:0 0 18px;white-space:pre-wrap;}
.opts{display:grid;gap:10px;}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 15px;font-family:inherit;font-size:15.5px;line-height:1.55;color:inherit;
  transition:border-color .12s,background .12s,transform .1s;
}
.opt:active{transform:scale(.995);}
.opt .k{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface2);
  border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt .v{flex:1;}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-bg);}
.opt.sel-ok .k{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-bg);}
.opt.sel-bad .k{background:var(--bad);border-color:var(--bad);color:#fff;}
.opt.give-ok{border-color:var(--ok);}
.opt.give-ok .k{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.dim{opacity:.62;}
.opts.locked .opt{cursor:default;}

/* ---------- explain ---------- */
.explain{
  margin-top:16px;border-radius:var(--radius);padding:15px 16px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  animation:slideIn .18s ease-out;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.explain.ok{border-color:var(--ok-bd);background:var(--ok-bg);}
.explain.bad{border-color:var(--bad-bd);background:var(--bad-bg);}
.verdict{font-weight:650;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.explain.ok .verdict{color:var(--ok);}
.explain.bad .verdict{color:var(--bad);}
.ans-line{font-size:14.5px;margin-bottom:6px;}
.ans-line b{color:var(--ok);font-weight:650;}
.ref-line{font-size:14px;color:#374151;line-height:1.6;}
.ref-line .lb{color:var(--muted);font-size:12.5px;display:block;margin-bottom:2px;}

/* ---------- foot nav ---------- */
.foot{display:flex;gap:10px;margin-top:22px;}
.foot .btn{flex:1;text-align:center;padding:13px;font-size:15px;}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;}

/* ---------- exam ---------- */
.timer{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--text);min-width:58px;}
.timer.warn{color:var(--bad);}
.timer.mid{color:#b45309;}
#scr-examsetup .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
#scr-examsetup ul{margin:12px 0 0;padding-left:20px;color:#374151;font-size:14.5px;line-height:1.9;}
#scr-examsetup li::marker{color:var(--accent);}
.bigbtn{width:100%;padding:16px;font-size:16px;}

/* sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin-top:6px;}
.sheet button{
  aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  font-family:inherit;font-size:13.5px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--muted);
}
.sheet button.done{background:var(--accent-soft);border-color:#bfd3fe;color:var(--accent);font-weight:600;}
.sheet button.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--text);font-weight:700;}

/* ---------- result ---------- */
.score-hero{text-align:center;padding:26px 0 10px;}
.score-hero .n{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.score-hero .n.pass{color:var(--ok);}
.score-hero .n.fail{color:var(--bad);}
.score-hero .d{color:var(--muted);font-size:14px;margin-top:10px;}
.sumrow{display:flex;gap:10px;margin:20px 0;}
.sumrow .cell{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;text-align:center;box-shadow:var(--shadow);}
.sumrow .cell b{display:block;font-size:21px;font-variant-numeric:tabular-nums;}
.sumrow .cell span{font-size:12.5px;color:var(--muted);}
.rv-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.rv-item .h{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.rv-item .s{font-weight:500;margin-bottom:12px;font-size:15.5px;white-space:pre-wrap;}
.rv-opt{font-size:14.5px;padding:8px 12px;border-radius:8px;margin-bottom:6px;border:1px solid transparent;line-height:1.5;}
.rv-opt.yours-bad{background:var(--bad-bg);border-color:var(--bad-bd);color:#7f1d1d;}
.rv-opt.right{background:var(--ok-bg);border-color:var(--ok-bd);color:#14532d;}
.rv-ref{font-size:13.5px;color:#4b5563;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);line-height:1.6;}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .16s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal[hidden]{display:none;}
.mbox{background:var(--surface);border-radius:18px;padding:24px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(16,24,40,.22);animation:pop .2s;}
@keyframes pop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
.mbox h3{margin:0 0 8px;font-size:17.5px;}
.mbox p{margin:0 0 20px;color:#374151;font-size:15px;line-height:1.65;}
.mbox .acts{display:flex;gap:10px;}
.mbox .acts .btn{flex:1;padding:13px;font-size:15px;}
.mbox .sheet-wrap{max-height:56vh;overflow:auto;}
@media (max-width:420px){ .brand h1{font-size:23px;} .stem{font-size:16px;} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <section id="scr-home" class="screen on">
    <div class="brand">
      <h1>澳門430法例選擇題</h1>
      <p>共 <b id="homeTotal">604</b> 題 · <span id="homeChaps">10</span> 個法例</p>
    </div>
    <div class="cards">
      <button class="card" id="goPractice">
        <span class="ico">📖</span>
        <b>練習模式</b>
        <small>逐題練習，答完即看解析</small>
        <span class="tp" id="homePracticeTip"></span>
      </button>
      <button class="card" id="goExam">
        <span class="ico">📝</span>
        <b>考試模式</b>
        <small>100 題 · 50 分鐘 · 滿分 100 分</small>
        <span class="tp" id="homeExamTip"></span>
      </button>
    </div>
    <div class="stat" id="homeStat"></div>
  </section>

  <!-- ============ SCOPE ============ -->
  <section id="scr-scope" class="screen">
    <div class="bar">
      <button class="btn ghost" id="scopeBack">← 返回</button>
      <h2>選擇練習範圍</h2>
      <span style="width:56px"></span>
    </div>
    <div id="scopeList"></div>
  </section>

  <!-- ============ PRACTICE ============ -->
  <section id="scr-practice" class="screen">
    <div class="bar">
      <button class="btn ghost" id="pBack">←</button>
      <div class="prog" id="pProg"></div>
      <button class="btn ghost" id="pScope">範圍</button>
    </div>
    <div class="qwrap" id="pQ"></div>
    <div id="pExp"></div>
    <div class="foot">
      <button class="btn" id="pPrev">上一題</button>
      <button class="btn primary" id="pNext">下一題</button>
    </div>
    <div class="hint">← 左右滑動可切換題目 →</div>
  </section>

  <!-- ============ EXAM SETUP ============ -->
  <section id="scr-examsetup" class="screen">
    <div class="bar">
      <button class="btn ghost" id="esBack">← 返回</button>
      <h2>考試模式</h2>
      <span style="width:56px"></span>
    </div>
    <div class="box">
      <ul>
        <li>隨機抽取 <b>100 道題</b>，每題 1 分，滿分 100 分</li>
        <li>限時 <b>50 分鐘</b>，時間到可選擇延時一次</li>
        <li>未學完全部題目時，<b>優先出你做過的題</b></li>
        <li>交卷後才顯示分數，並可查看錯題解析</li>
      </ul>
    </div>
    <div class="box" id="esStatBox" style="font-size:14.5px;color:#374151;line-height:1.9;"></div>
    <button class="btn primary bigbtn" id="esStart">開始考試</button>
  </section>

  <!-- ============ EXAM ============ -->
  <section id="scr-exam" class="screen">
    <div class="bar">
      <div class="timer" id="eTimer">50:00</div>
      <div class="prog" id="eProg"></div>
      <button class="btn" id="eSubmit">交卷</button>
    </div>
    <div class="qwrap" id="eQ"></div>
    <div class="foot">
      <button class="btn" id="ePrev">上一題</button>
      <button class="btn" id="eSheet">答題卡</button>
      <button class="btn primary" id="eNext">下一題</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="scr-result" class="screen">
    <div class="bar">
      <button class="btn ghost" id="rBack">← 首頁</button>
      <h2>考試結果</h2>
      <span style="width:56px"></span>
    </div>
    <div class="score-hero">
      <div class="n" id="rScore">0</div>
      <div class="d" id="rDesc"></div>
    </div>
    <div class="sumrow">
      <div class="cell"><b id="rRight">0</b><span>答對</span></div>
      <div class="cell"><b id="rWrong">0</b><span>答錯</span></div>
      <div class="cell"><b id="rMiss">0</b><span>未答</span></div>
      <div class="cell"><b id="rTime">0'00"</b><span>用時</span></div>
    </div>
    <button class="btn primary bigbtn" id="rReview">查看錯題解析</button>
    <div id="rList" style="margin-top:18px;"></div>
    <button class="btn bigbtn" id="rHome2" style="margin-top:8px;">返回首頁</button>
  </section>

</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

var LT = ['A','B','C','D'];
var LSKEY = 'a430_v1';

/* ---------------- state ---------------- */
function loadState(){
  try{
    var d = JSON.parse(localStorage.getItem(LSKEY) || '{}');
    return { learned: d.learned || {}, pos: d.pos || {}, lastExam: d.lastExam || null };
  }catch(e){ return { learned:{}, pos:{}, lastExam:null }; }
}
var S = loadState();
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function show(id){ var ss=document.querySelectorAll('.screen'); for(var i=0;i<ss.length;i++) ss[i].classList.remove('on'); $('#'+id).classList.add('on'); window.scrollTo(0,0); }

/* ---------------- scope ---------------- */
function learnedCount(){ return Object.keys(S.learned).length; }
function wrongIds(){ return Object.keys(S.learned).filter(function(k){return S.learned[k]===0;}).map(Number).sort(function(a,b){return a-b;}); }
function idsOf(scope){
  if(scope==='all') return QB.map(function(_,i){return i;});
  if(scope==='wrong') return wrongIds();
  var ci = +scope.slice(1);
  var r=[]; for(var i=0;i<QB.length;i++) if(QB[i].c===ci) r.push(i);
  return r;
}
function chapCount(ci){ var n=0; for(var i=0;i<QB.length;i++) if(QB[i].c===ci) n++; return n; }
function chapLearned(ci){ var n=0; for(var i=0;i<QB.length;i++) if(QB[i].c===ci && S.learned[i]!=null) n++; return n; }

function renderScope(){
  var box = $('#scopeList'); box.innerHTML='';
  var allN = QB.length, allL = learnedCount();
  var g1 = document.createElement('div'); g1.className='scope-group';
  g1.innerHTML = '<h3>綜合</h3>' + scopeRow('all','全部題目', allN, allL) + scopeRow('wrong','錯題重練', wrongIds().length, 0, true);
  box.appendChild(g1);
  var g2 = document.createElement('div'); g2.className='scope-group';
  g2.innerHTML = '<h3>按法例</h3>';
  for(var ci=0; ci<CH.length; ci++){
    g2.innerHTML += scopeRow('c'+ci, CH[ci], chapCount(ci), chapLearned(ci));
  }
  box.appendChild(g2);
  box.querySelectorAll('.scope-item').forEach(function(b){
    b.onclick = function(){ startPractice(b.getAttribute('data-k')); };
  });
}
function scopeRow(key,name,total,learned,plain){
  var bar = plain ? '' : '<span class="bar-mini"><i style="width:'+(total?Math.round(learned/total*100):0)+'%"></i></span>';
  var n = plain ? (total+' 題') : (learned+' / '+total);
  return '<button class="scope-item" data-k="'+key+'"><span class="nm">'+esc(name)+'</span>'+bar+'<span class="ct">'+n+'</span></button>';
}

/* ---------------- practice ---------------- */
var P = { scope:'all', ids:[], idx:0, res:{} };

function startPractice(scope){
  var ids = idsOf(scope);
  if(!ids.length){
    modal('<h3>暫時沒有題目</h3><p>'+(scope==='wrong' ? '目前還沒有做錯的題目，先去練幾題吧。' : '此範圍暫時沒有題目。')+'</p>',
      [{t:'知道了',cls:'primary',fn:closeModal}]);
    return;
  }
  P.scope = scope; P.ids = ids;
  var p = S.pos[scope] || 0;
  P.idx = Math.min(Math.max(0,p), ids.length-1);
  P.res = {};
  // restore answers already given this session for these questions
  show('scr-practice'); renderPractice();
}

function renderPractice(){
  var qid = P.ids[P.idx], q = QB[qid];
  $('#pProg').textContent = (P.idx+1) + ' / ' + P.ids.length;
  var sel = P.res[qid];
  var answered = (sel != null);
  var h = '<div class="qmeta"><span class="chip">'+esc(CH[q.c])+'</span><span>第 '+q.n+' 題</span></div>';
  h += '<div class="stem">'+esc(q.s)+'</div><div class="opts'+(answered?' locked':'')+'" id="pOpts">';
  for(var i=0;i<q.o.length;i++){
    var cls = 'opt';
    if(answered){
      if(i===sel && LT[i]===q.a) cls += ' sel-ok';
      else if(i===sel) cls += ' sel-bad dim';
      else if(LT[i]===q.a) cls += ' give-ok';
      else cls += ' dim';
    }
    h += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'><span class="k">'+LT[i]+'</span><span class="v">'+esc(q.o[i])+'</span></button>';
  }
  h += '</div>';
  $('#pQ').innerHTML = h;
  if(!answered){
    $('#pOpts').querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){ answerPractice(+b.getAttribute('data-i')); };
    });
  }
  renderPracticeExplain();
  $('#pPrev').disabled = (P.idx===0);
  $('#pNext').textContent = (P.idx===P.ids.length-1) ? '完成' : '下一題';
  S.pos[P.scope] = P.idx; save();
}

function answerPractice(i){
  var qid = P.ids[P.idx], q = QB[qid];
  if(P.res[qid] != null) return;
  P.res[qid] = i;
  S.learned[qid] = (LT[i]===q.a) ? 1 : 0;
  save();
  renderPractice();
  var ex = $('#pExp');
  if(ex && ex.scrollIntoView) setTimeout(function(){ ex.scrollIntoView({behavior:'smooth',block:'nearest'}); },60);
}

function renderPracticeExplain(){
  var qid = P.ids[P.idx], q = QB[qid], sel = P.res[qid];
  var box = $('#pExp');
  if(sel == null){ box.innerHTML=''; return; }
  var ok = (LT[sel]===q.a);
  var h = '<div class="explain '+(ok?'ok':'bad')+'">';
  h += '<div class="verdict">'+(ok?'✓ 答對了':'✗ 答錯了')+'</div>';
  if(!ok) h += '<div class="ans-line">正確答案：<b>'+q.a+'</b>　你選了 '+LT[sel]+'</div>';
  else h += '<div class="ans-line">正確答案：<b>'+q.a+'</b></div>';
  if(q.r) h += '<div class="ref-line"><span class="lb">條文依據</span>'+esc(q.r)+'</div>';
  h += '</div>';
  box.innerHTML = h;
}

function nextPractice(d){
  var n = P.idx + d;
  if(n < 0) return;
  if(n >= P.ids.length){ if(d>0){ show('scr-home'); homeRefresh(); } return; }
  P.idx = n; renderPractice();
}

/* swipe */
(function(){
  var x0=null,y0=null,el0=null;
  document.addEventListener('touchstart',function(e){
    var t=e.target; if(!t.closest) return;
    el0 = t.closest('#pQ, #eQ');
    if(!el0) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null||!el0) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    var isP = el0.id==='pQ';
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
      if(isP) nextPractice(dx<0?1:-1); else examNav(dx<0?1:-1);
    }
    x0=null; y0=null; el0=null;
  },{passive:true});
})();

/* ---------------- exam ---------------- */
var E = null;

function examReady(){
  var L = learnedCount(), T = QB.length;
  var per = Math.min(100, L);
  $('#esStatBox').innerHTML =
    '你已學過 <b>'+L+'</b> / '+T+' 題（'+Math.round(L/T*100)+'%）<br>'+
    '本次試卷：已學過的題 <b>'+per+'</b> 道'+(per<100 ?' + 新題 <b>'+(100-per)+'</b> 道' : '')+'。';
}
function startExam(){
  var pool=[], rest=[];
  for(var i=0;i<QB.length;i++){ if(S.learned[i]!=null) pool.push(i); else rest.push(i); }
  shuffle(pool); shuffle(rest);
  var ids = pool.slice(0,100);
  if(ids.length<100) ids = ids.concat(rest.slice(0, 100-ids.length));
  shuffle(ids);
  E = { ids:ids, idx:0, ans:{}, left:50*60, ext:false, done:false,
        started:Date.now(), used:0, deadline:Date.now()+50*60*1000 };
  $('#eTimer').className='timer';
  updateTimer(); examRender();
  show('scr-exam');
  E.timer = setInterval(tick, 1000);
}

/* --- unfinished-exam persistence (a backgrounded tab can be killed) --- */
var EKEY = LSKEY + '_exam';
function saveExam(){
  try{
    if(!E || E.done){ localStorage.removeItem(EKEY); return; }
    localStorage.setItem(EKEY, JSON.stringify({ ids:E.ids, ans:E.ans, idx:E.idx, deadline:E.deadline, ext:E.ext, started:E.started }));
  }catch(e){}
}
function loadExam(){
  try{ var d = JSON.parse(localStorage.getItem(EKEY) || 'null'); return (d && d.ids && d.ids.length) ? d : null; }catch(e){ return null; }
}
function clearExam(){ try{ localStorage.removeItem(EKEY); }catch(e){} }
function examEntry(){
  var d = loadExam();
  if(!d){ startExam(); return; }
  var left = Math.max(0, Math.round((d.deadline - Date.now())/1000));
  modal('<h3>未完成的考試</h3><p>偵測到上次未完成的考試，剩餘時間 <b>'+fmt(left)+'</b>。<br>要繼續嗎？</p>',
    [{t:'繼續考試',cls:'primary',fn:function(){ closeModal(); resumeExam(d); }},
     {t:'重新開始',cls:'',fn:function(){ closeModal(); clearExam(); startExam(); }}]);
}
function resumeExam(d){
  E = { ids:d.ids, idx:Math.min(d.idx||0, d.ids.length-1), ans:d.ans || {}, ext:!!d.ext, done:false,
        started:d.started || Date.now(), used:0, deadline:d.deadline, left:0 };
  $('#eTimer').className='timer';
  examRender(); show('scr-exam');
  E.timer = setInterval(tick, 1000);
  tick();
}
function fmt(s){ s=Math.max(0,s); var m=Math.floor(s/60), ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function updateTimer(){
  $('#eTimer').textContent = fmt(E.left);
  $('#eTimer').className = 'timer' + (E.left<=60?' warn' : (E.left<=300?' mid':''));
}
/* remaining time is derived from a wall-clock deadline, never decremented,
   so backgrounded tabs (where setInterval is throttled) cannot drift */
function tick(){
  if(!E || E.done) return;
  E.left = Math.max(0, Math.round((E.deadline - Date.now())/1000));
  updateTimer();
  if(E.left<=0){
    clearInterval(E.timer); E.timer = null;
    if(!E.ext) askExtend(); else doSubmit(true);
  }
}
function askExtend(){
  modal(
    '<h3>時間到了</h3><p>是否要親親老公延時 20 分鐘？</p>',
    [{t:'是',cls:'primary',fn:function(){
        closeModal(); E.ext=true; E.deadline = Date.now()+20*60*1000; E.left=20*60;
        updateTimer(); saveExam(); E.timer=setInterval(tick,1000);
      }},
     {t:'否',cls:'',fn:function(){ closeModal(); doSubmit(true); }}]
  );
}
function examRender(){
  var qid = E.ids[E.idx], q = QB[qid];
  $('#eProg').textContent = (E.idx+1) + ' / ' + E.ids.length;
  var sel = E.ans[qid];
  var h = '<div class="qmeta"><span class="chip">'+esc(CH[q.c])+'</span><span>第 '+q.n+' 題</span></div>';
  h += '<div class="stem">'+esc(q.s)+'</div><div class="opts" id="eOpts">';
  for(var i=0;i<q.o.length;i++){
    h += '<button class="opt'+(sel===i?' sel-ok':'')+'" data-i="'+i+'"><span class="k">'+LT[i]+'</span><span class="v">'+esc(q.o[i])+'</span></button>';
  }
  h += '</div>';
  $('#eQ').innerHTML = h;
  $('#eOpts').querySelectorAll('.opt').forEach(function(b){
    b.onclick = function(){
      var i = +b.getAttribute('data-i');
      E.ans[qid] = (E.ans[qid]===i) ? (delete E.ans[qid], undefined) : i;
      examRender();
    };
  });
  $('#ePrev').disabled = (E.idx===0);
  saveExam();
}
function examNav(d){
  var n = E.idx + d;
  if(n<0 || n>=E.ids.length) return;
  E.idx = n; examRender();
}
function showSheet(){
  var h = '<h3>答題卡</h3><p style="margin-bottom:12px;">已答 <b>'+Object.keys(E.ans).length+'</b> / '+E.ids.length+'</p><div class="sheet-wrap"><div class="sheet">';
  for(var i=0;i<E.ids.length;i++){
    var qid=E.ids[i], cls = (E.ans[qid]!=null?'done':'') + (i===E.idx?' cur':'');
    h += '<button class="'+cls+'" data-i="'+i+'">'+(i+1)+'</button>';
  }
  h += '</div></div>';
  modal(h, [{t:'關閉',cls:'',fn:closeModal}], true);
  $('#mbox').querySelectorAll('.sheet button').forEach(function(b){
    b.onclick = function(){ E.idx = +b.getAttribute('data-i'); closeModal(); examRender(); };
  });
}
function confirmSubmit(){
  var miss = E.ids.length - Object.keys(E.ans).length;
  modal('<h3>確認交卷？</h3><p>'+(miss>0 ? ('還有 <b>'+miss+'</b> 道題未作答，') : '')+'交卷後將顯示分數。</p>',
    [{t:'交卷',cls:'primary',fn:function(){ closeModal(); doSubmit(false); }},
     {t:'繼續答題',cls:'',fn:closeModal}]);
}
function doSubmit(timeUp){
  if(!E || E.done) return;
  E.done = true; clearInterval(E.timer); E.timer = null; clearExam();
  E.used = Math.round((Date.now()-E.started)/1000);
  var right=0, wrong=0, miss=0, wrongList=[];
  for(var i=0;i<E.ids.length;i++){
    var qid=E.ids[i], q=QB[qid], sel=E.ans[qid];
    if(sel==null){ miss++; wrongList.push([qid,null]); }
    else if(LT[sel]===q.a){ right++; }
    else { wrong++; wrongList.push([qid,sel]); }
  }
  E.score = right; E.wrongList = wrongList;
  S.lastExam = { score:right, total:E.ids.length, ts:Date.now() };
  save();
  renderResult(timeUp);
}

function renderResult(timeUp){
  var n = E.score, total = E.ids.length;
  $('#rScore').textContent = n;
  $('#rScore').className = 'n ' + (n>=60?'pass':'fail');
  $('#rDesc').textContent = (timeUp?'時間到，已自動交卷　':'') + '滿分 '+total+' 分';
  $('#rRight').textContent = n;
  $('#rWrong').textContent = E.wrongList.length - (E.wrongList.filter(function(x){return x[1]==null;}).length);
  $('#rMiss').textContent = E.wrongList.filter(function(x){return x[1]==null;}).length;
  var m = Math.floor(E.used/60), s = E.used%60;
  $('#rTime').textContent = m + "'" + (s<10?'0':'') + s + '"';
  renderReview();
  show('scr-result');
}
function renderReview(){
  var box = $('#rList');
  if(!E.wrongList.length){ box.innerHTML = '<div class="rv-item" style="text-align:center;color:var(--muted)">全部答對，沒有錯題 🎉</div>'; return; }
  var h='';
  for(var k=0;k<E.wrongList.length;k++){
    var qid=E.wrongList[k][0], mine=E.wrongList[k][1], q=QB[qid];
    h += '<div class="rv-item">';
    h += '<div class="h">'+esc(CH[q.c])+' · 第 '+q.n+' 題</div>';
    h += '<div class="s">'+esc(q.s)+'</div>';
    for(var i=0;i<q.o.length;i++){
      var isRight = (LT[i]===q.a), isMine = (mine===i);
      if(isRight) h += '<div class="rv-opt right">'+LT[i]+'. '+esc(q.o[i])+'　✓ 正確答案</div>';
      else if(isMine) h += '<div class="rv-opt yours-bad">'+LT[i]+'. '+esc(q.o[i])+'　✗ 你選的</div>';
    }
    if(q.r) h += '<div class="rv-ref"><b>條文依據：</b>'+esc(q.r)+'</div>';
    h += '</div>';
  }
  box.innerHTML = h;
}

/* ---------------- modal ---------------- */
function modal(html, acts, wide){
  $('#mbox').innerHTML = html + '<div class="acts"></div>';
  if(wide) $('#mbox').style.maxWidth='520px'; else $('#mbox').style.maxWidth='400px';
  var box = $('#mbox').querySelector('.acts');
  acts.forEach(function(a){
    var b = document.createElement('button');
    b.className = 'btn ' + (a.cls||''); b.textContent = a.t; b.onclick = a.fn;
    box.appendChild(b);
  });
  $('#modal').hidden = false;
}
function closeModal(){ $('#modal').hidden = true; }

/* ---------------- home ---------------- */
function homeRefresh(){
  var L = learnedCount(), T = QB.length;
  $('#homeTotal').textContent = T;
  $('#homeChaps').textContent = CH.length;
  $('#homePracticeTip').textContent = L>0 ? ('已學 '+L+' / '+T+' 題') : '';
  var le = S.lastExam;
  var tip = le ? ('上次得分 '+le.score+' / '+le.total) : '';
  var pend = loadExam();
  if(pend) tip = (tip ? tip + '　·　' : '') + '有未完成的考試';
  $('#homeExamTip').textContent = tip;
  var w = wrongIds().length;
  $('#homeStat').textContent = '已學 '+L+' / '+T+' 題' + (w? '　·　錯題 '+w+' 道' : '');
}

/* ---------------- wire ---------------- */
$('#goPractice').onclick = function(){ renderScope(); show('scr-scope'); };
$('#goExam').onclick = function(){ examReady(); show('scr-examsetup'); };
$('#scopeBack').onclick = function(){ show('scr-home'); homeRefresh(); };
$('#pBack').onclick = function(){ show('scr-home'); homeRefresh(); };
$('#pScope').onclick = function(){ renderScope(); show('scr-scope'); };
$('#pPrev').onclick = function(){ nextPractice(-1); };
$('#pNext').onclick = function(){ nextPractice(1); };
$('#esBack').onclick = function(){ show('scr-home'); homeRefresh(); };
$('#esStart').onclick = examEntry;
$('#ePrev').onclick = function(){ examNav(-1); };
$('#eNext').onclick = function(){ examNav(1); };
$('#eSheet').onclick = showSheet;
$('#eSubmit').onclick = confirmSubmit;
$('#rReview').onclick = function(){ $('#rList').scrollIntoView({behavior:'smooth'}); };
$('#rBack').onclick = $('#rHome2').onclick = function(){ E=null; show('scr-home'); homeRefresh(); };
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeModal();
});
window.addEventListener('beforeunload', function(){ save(); saveExam(); });
// coming back from a backgrounded tab: re-sync the clock and persist
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && E && !E.done) tick();
  else saveExam();
});

homeRefresh();
</script>
</body>
</html>
